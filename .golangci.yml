version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      # Test fixtures intentionally use executable files, open permissions, and
      # dynamic subprocesses; they are not part of the shipped attack surface.
      - path: _test\.go
        linters:
          - gosec
  settings:
    errcheck:
      exclude-functions:
        # Close() on clients/streams is idiomatic fire-and-forget.
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (github.com/moby/moby/client.APIClient).Close
        # Cobra completion generators in RunE — we return nil either way.
        - (*github.com/spf13/cobra.Command).GenBashCompletionV2
        - (*github.com/spf13/cobra.Command).GenZshCompletion
        - (*github.com/spf13/cobra.Command).GenFishCompletion
        # Terminal state restore is best-effort.
        - golang.org/x/term.Restore

formatters:
  enable:
    - gofmt
