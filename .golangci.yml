version: "2"

run:
  timeout: 5m
  # The daemon gates are code too: without the tag no linter reads them.
  build-tags:
    - dockergate

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - forbidigo
    - govet
    - gosec
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unused
  exclusions:
    rules:
      # Match Sonar's test-file exception; table cases are not product complexity.
      - path: _test\.go
        linters:
          - gocognit
      # Test fixtures intentionally use executable files, open permissions, and
      # dynamic subprocesses; they are not part of the shipped attack surface.
      - path: _test\.go
        linters:
          - gosec
  settings:
    depguard:
      rules:
        # internal/container is the Docker edge: cmd/ hands its client down to
        # the leaves, and a leaf importing it back inverts that direction.
        container-edge:
          files:
            - "$all"
            - "!**/cmd/**"
            - "!**/internal/container/**"
          deny:
            - pkg: github.com/filippolmt/toolbox/internal/container
              desc: only cmd/ imports the container edge; take the narrow Docker interface you need instead
    forbidigo:
      # Matched on the resolved package, so an aliased import is caught too.
      analyze-types: true
      forbid:
        - pattern: ^container\.WaitConditionNotRunning$
          pkg: ^github\.com/moby/moby/api/types/container$
          msg: "register a container.WaitConditionNextExit wait before ContainerStart: not-running answers at once on a created container"
    # Enabled separately for the diff by go-lint-new and CI, not retroactively
    # across untouched functions. SonarQube remains the authoritative gate.
    gocognit:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    errcheck:
      exclude-functions:
        # Close() on clients/streams is idiomatic fire-and-forget.
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (github.com/moby/moby/client.APIClient).Close
        # Cobra completion generators in RunE — we return nil either way.
        - (*github.com/spf13/cobra.Command).GenBashCompletionV2
        - (*github.com/spf13/cobra.Command).GenZshCompletion
        - (*github.com/spf13/cobra.Command).GenFishCompletion
        # Terminal state restore is best-effort.
        - golang.org/x/term.Restore

issues:
  # Security baselines need the complete finding set in one run; the default
  # per-message cap otherwise reveals another batch only after each fix.
  max-same-issues: 0

formatters:
  enable:
    - gofmt
