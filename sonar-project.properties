sonar.projectKey=toolbox
sonar.projectName=toolbox

sonar.sources=cmd,internal,main.go
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/vendor/**,**/openspec/**,**/internal/build/assets/**,**/testdata/**

sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8

# `sonar.exclusions` drops the test files from *sources*, but `sonar.tests` +
# `sonar.test.inclusions` re-index them as test code, so rules still fire on
# them. Cognitive Complexity is the one rule that measures nothing real there:
# a table-driven Go test is a loop over cases plus nested `t.Run` and assert
# blocks, so the score tracks how many cases the table covers, not how hard the
# test is to read. Splitting a table to satisfy the threshold costs the
# at-a-glance view of the cases and buys nothing.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
