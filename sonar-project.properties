sonar.projectKey=toolbox
sonar.projectName=toolbox

sonar.sources=cmd,internal,main.go
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/vendor/**,**/openspec/**,**/internal/build/assets/**,**/testdata/**

sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8

# Cognitive Complexity off for test files only — a table-driven Go test scores
# how many cases the table covers, not how hard it is to read.
# Why, in full: docs/internals/sonarqube.md#cognitive-complexity-is-off-for-test-files
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
