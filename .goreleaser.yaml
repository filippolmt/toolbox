version: 2

builds:
  - main: ./main.go
    binary: toolbox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/filippolmt/toolbox/internal/version.Version={{.Version}}
      - -X github.com/filippolmt/toolbox/internal/version.Commit={{.Commit}}
      - -X github.com/filippolmt/toolbox/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# `brews` (Homebrew Formula) was hard-deprecated in GoReleaser v2.16. Casks
# are macOS-only, so the tap no longer serves Linuxbrew — Linux users install
# via `go install` or the released binaries. The binary is unsigned, so the
# post-install hook strips the macOS quarantine bit to avoid the
# "toolbox is damaged" Gatekeeper alert.
homebrew_casks:
  - name: toolbox
    repository:
      owner: filippolmt
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/filippolmt/toolbox"
    description: "CLI for the containerized dev toolbox"
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/toolbox"]
          end
