version: 2

builds:
  - main: ./main.go
    binary: toolbox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/filippolmt/toolbox/internal/version.Version={{.Version}}
      - -X github.com/filippolmt/toolbox/internal/version.Commit={{.Commit}}
      - -X github.com/filippolmt/toolbox/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# `brews` (Homebrew Formula) was hard-deprecated in GoReleaser v2.16. Casks
# are macOS-only, so the tap no longer serves Linuxbrew — Linux users install
# via `go install` or the released binaries. The binary is unsigned, so a
# preflight step strips the macOS quarantine bit to avoid the
# "toolbox is damaged" Gatekeeper alert; it must run *pre* (not post) install
# because `generate_completions_from_executable` executes the staged binary
# during the install phase, and a still-quarantined unsigned binary gets
# killed by Gatekeeper before it can emit the completion scripts.
homebrew_casks:
  - name: toolbox
    repository:
      owner: filippolmt
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/filippolmt/toolbox"
    description: "CLI for the containerized dev toolbox"
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    # Install shell completions by running `toolbox completion <shell>` at
    # install time (GoReleaser >= v2.15). `shells` is pinned because
    # cmd/completion.go only accepts bash|zsh|fish, while the default set
    # would also try pwsh and fail the install.
    generate_completions_from_executable:
      args:
        - completion
      shells:
        - bash
        - zsh
        - fish
    # The quarantine step goes through `custom_block` and not `hooks.pre.install`:
    # that field emits the legacy `preflight do` Ruby block, which Homebrew has
    # deprecated in favour of the declarative `preflight_steps` stanza. Homebrew
    # expands the `{{staged_path}}` token at install time, so it is escaped here
    # to survive GoReleaser's own templating. `preflight_steps` sorts ahead of
    # `generate_completions_from_executable`, so the ordering the comment above
    # requires still holds.
    custom_block: |
      preflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/toolbox"]
      end
