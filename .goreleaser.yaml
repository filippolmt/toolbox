version: 2

builds:
  - main: ./main.go
    binary: toolbox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/filippolmt/toolbox/internal/version.Version={{.Version}}
      - -X github.com/filippolmt/toolbox/internal/version.Commit={{.Commit}}
      - -X github.com/filippolmt/toolbox/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# `brews` (Homebrew Formula) is hard-deprecated in GoReleaser, so the tap ships
# a cask. A cask targets macOS — Linux users install via `go install` or the
# released binaries — but that is an aim, not a guarantee Homebrew enforces:
# `Cask#supports_linux?` is true for any cask without `depends_on macos:`, so
# Linuxbrew will happily install this one. Hence the `on_macos` guard below.
homebrew_casks:
  - name: toolbox
    repository:
      owner: filippolmt
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/filippolmt/toolbox"
    description: "CLI for the containerized dev toolbox"
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    # Install shell completions by running `toolbox completion <shell>` at
    # install time. `shells` is pinned because cmd/completion.go only accepts
    # bash|zsh|fish, while the default set would also try pwsh and fail the
    # install.
    generate_completions_from_executable:
      args:
        - completion
      shells:
        - bash
        - zsh
        - fish
    # The binary is unsigned, so the macOS quarantine bit has to go or Gatekeeper
    # refuses to run it with a "toolbox is damaged" alert. Three things shape
    # the stanza:
    #
    #   - It strips *before* `generate_completions_from_executable` executes the
    #     staged binary, or Gatekeeper kills that binary before it can emit the
    #     completion scripts. Homebrew orders cask artifacts by class, not by
    #     position in the file: `PreflightSteps` is the first entry of that
    #     order and `GeneratedCompletion` one of the last, so `preflight_steps`
    #     holds the constraint and `postflight_steps` would break it.
    #   - It goes through `custom_block` rather than `hooks.pre.install`, which
    #     emits the legacy `preflight do` Ruby block Homebrew has deprecated in
    #     favour of the declarative `preflight_steps` stanza.
    #   - `on_macos` keeps it a no-op under Linuxbrew, where `/usr/bin/xattr`
    #     does not exist and `run` — which defaults to `must_succeed: true` —
    #     would abort the install.
    #
    # Homebrew expands `{{staged_path}}` at install time, so it is escaped here
    # to survive GoReleaser's own templating first.
    custom_block: |
      preflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/toolbox"]
        end
      end
