version: 2

builds:
  - main: ./main.go
    binary: toolbox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/filippolmt/toolbox/internal/version.Version={{.Version}}
      - -X github.com/filippolmt/toolbox/internal/version.Commit={{.Commit}}
      - -X github.com/filippolmt/toolbox/internal/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: toolbox
    repository:
      owner: filippolmt
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/filippolmt/toolbox"
    description: "CLI for the containerized dev toolbox"
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    install: |
      bin.install "toolbox"
    test: |
      system "#{bin}/toolbox", "--version"
