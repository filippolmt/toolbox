# Toolbox starship config (D-05). The win over upstream defaults comes from
# an explicit `format` that lists ONLY the modules we use: any module not
# listed below is skipped entirely (no file stat, no env lookup) — far faster
# than `disabled = true`, which still requires starship to consult each
# module in `$all`.
#
# Modules in the left-prompt format (in order): directory, git_branch,
# git_status, git_state, docker_context, kubernetes, terraform, gcloud,
# cmd_duration. `$line_break` + `$character` close the left prompt on a new
# line. `right_format` holds the clock.
#
# Excluded by omission: every language runtime (no nodejs/python/rust/bun
# probe per prompt), aws/azure/openstack, sudo, jobs, battery, status,
# container, netns, os, shell, username, hostname, package, line counters,
# memory_usage, mise/direnv/custom, conda/pixi/spack/meson, hg/fossil/pijul.
#
# Path inside the image: /etc/toolbox/starship.toml (selected by
# STARSHIP_CONFIG env baked into the Dockerfile). Per-user override still
# possible via `STARSHIP_CONFIG=$HOME/.toolbox-state/starship.toml` in a
# ~/.toolbox-startup.d/ hook — no edits to this file needed.
#
# Per-module opt-out toggles: set PROMPT_HIDE_KUBE / PROMPT_HIDE_GCLOUD (via
# `env:` in .toolbox.yaml, then `toolbox stop`) to hide those segments. Only
# kubernetes/gcloud are env-toggleable — terraform/docker_context are
# directory-scoped, and the veto below can't override a scan match. Full
# mechanism + the STARSHIP_LOG dangling-context story live in one place:
# docs/internals/shell-start.md#prompt-module-toggles

# Upstream default is 500ms, which trips on macOS bind-mounted repos where
# `git` status calls cross the host/container filesystem boundary and emit
# `Executing command "/usr/bin/git" timed out` warnings. 1000ms absorbs the
# bind-mount overhead without making a sluggish prompt feel broken.
command_timeout = 1000

# Upstream default is 30ms — same bind-mount latency that trips
# `command_timeout` also trips file-scan probes (kubernetes/gcloud
# config files, docker_context detect_files glob). 50ms keeps the
# prompt responsive while absorbing the host/container boundary cost.
scan_timeout = 50

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$docker_context\
$kubernetes\
$terraform\
$gcloud\
$cmd_duration\
$line_break\
$character"""

right_format = "$time"

# -- Left prompt segments ----------------------------------------------------

[character]
success_symbol = "[➜](bold green) "
error_symbol   = "[✗](bold red) "

[directory]
truncation_length = 4
truncate_to_repo  = true
truncation_symbol = "…/"
style             = "bold cyan"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
style      = "bold red"
conflicted = "✖"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
modified   = "!${count}"
staged     = "+${count}"
untracked  = "?${count}"

[cmd_duration]
min_time = 500
format   = "took [$duration]($style) "
style    = "yellow"

# Symbol overrides below replace Starship's ambiguous-width defaults with
# Nerd Font PUA glyphs: width-1 under both libc wcwidth() and Ghostty's
# grapheme-cluster width (mode 2027), so ZLE line redraw can never drift
# (drift = ghost characters on Backspace). Per-symbol codepoints inline;
# backstory + diagnostic heuristic: docs/internals/shell-start.md#prompt-glyph-width

# Upstream default: disabled. We enable because kubectl is bundled and a
# misclick on the wrong context is a recurring footgun. Detection reads
# ~/.kube/config (single file stat, no live API). No `detect_files/folders/
# extensions` so the module is active in every directory once a context is set.
# detect_env_vars = ["!PROMPT_HIDE_KUBE"] makes it opt-out (a `!`-veto, works
# here only because there's no scan config to short-circuit it).
# Mechanism: docs/internals/shell-start.md#prompt-module-toggles
[kubernetes]
disabled        = false
detect_env_vars = ["!PROMPT_HIDE_KUBE"]
symbol          = "󱃾 "  # nf-md-kubernetes U+F10FE (replaces ☸ U+2638)
format          = '[$symbol$context( \($namespace\))]($style) '
style           = "blue bold"

[terraform]
symbol = "󱁢 "  # nf-md-terraform U+F1062 (replaces 💠 U+1F4A0)
format = "[$symbol$workspace]($style) "
style  = "bold purple"

# gcloud module is file-based — reads ~/.config/gcloud/active_config and the
# matching configurations/config_<name> file. No `gcloud` invocation per
# prompt. Default format includes `$account@$domain ($region)`; we trim to
# just `$project` because the project is the field we routinely act on, and
# account/region only matter when switching configs (which itself updates
# active_config and shows up next prompt).
#
# Opt-out toggle (same veto mechanism as [kubernetes] — no scan config here
# either, so the negated env var decides): set PROMPT_HIDE_GCLOUD to hide.
[gcloud]
detect_env_vars = ["!PROMPT_HIDE_GCLOUD"]
symbol          = "󰅟 "  # nf-md-cloud U+F015F (replaces ☁️ U+2601+FE0F)
format          = 'on [$symbol$project]($style) '
style           = "bold blue"

# docker_context inherits upstream defaults except `symbol` (see PUA note
# above) — module appears only inside dirs whose `detect_files` glob matches
# (Dockerfile / compose.yml / docker-compose.yml etc.), and only when the
# current Docker context is non-default OR a DOCKER_CONTEXT / DOCKER_HOST /
# DOCKER_MACHINE_NAME env var is set.
[docker_context]
symbol = "󰡨 "  # nf-md-docker U+F0868 (replaces 🐳 U+1F433)

# -- Right prompt segments ---------------------------------------------------

# `time` is disabled by default upstream. Enable here and place in
# `right_format` so the clock doesn't push the left prompt around.
[time]
disabled    = false
format      = '[\[$time\]]($style) '
style       = "dim white"
time_format = "%H:%M:%S"
