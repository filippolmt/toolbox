# Workflow CI/CD per build, test e push dell'immagine Docker toolbox su GHCR.
# Pattern: test-before-push (build locale -> smoke test -> push multi-arch).
#
# Decisioni implementate: D-01..D-14 da 03-CONTEXT.md
# Pitfall mitigati: permessi espliciti, no load+platforms, QEMU prima di Buildx,
#                   cache GHA con scope per piattaforma (amd64 scritto dal test,
#                   arm64 scritto dal multi-arch) per evitare overwrite tra step.

name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - 'internal/build/assets/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
  # NOTE: tag-driven semver publish lives in `docker-publish-tag.yml`. Two
  # workflow files because GitHub Actions ANDs `paths:` with every push
  # event (including tag pushes), so a single workflow can't both (a)
  # path-filter main pushes AND (b) fire on every `v*` tag.

# Tag-triggered (release) and main-triggered (latest) runs must NOT cancel
# each other — both are durable artifact pushes. Distinct group per run
# disables cancellation while keeping the knob present for future tweaks.
concurrency:
  group: docker-publish-${{ github.run_id }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEST_TAG: ghcr.io/${{ github.repository }}:test

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and load for testing
        uses: docker/build-push-action@v7
        with:
          context: internal/build/assets
          file: internal/build/assets/Dockerfile
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Smoke test
        run: internal/build/assets/smoke-test.sh ${{ env.TEST_TAG }}

      - name: Build and push multi-arch
        id: push
        uses: docker/build-push-action@v7
        with:
          context: internal/build/assets
          file: internal/build/assets/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA build provenance + SPDX SBOM attached as OCI attestations
          # so consumers can verify supply-chain integrity from `cosign verify`
          # / `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Cache Trivy vuln DB
        # trivy-action 0.36+ writes the DB to ~/.cache/trivy. Persisting it
        # between runs cuts ~30s off cold scans (DB is ~500MB and refreshes
        # daily). The key uses run_id so the latest run always writes; older
        # restore-keys hit yesterday's DB while it's still valid.
        uses: actions/cache@v5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan published image for HIGH/CRITICAL CVEs (advisory)
        # Advisory only — never blocks a publish. Surfaces vulnerabilities in
        # the GHA logs so a maintainer can decide if a tool bump is warranted.
        # Pinned to a known-good tag (Renovate can bump it via the
        # github-releases datasource if/when added to renovate.json).
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          # Pin by digest so the scan targets exactly the image we just pushed —
          # safe across both tag-triggered runs (no `latest`) and main-triggered
          # runs (`latest` exists). Output of build-push-action is the manifest
          # list digest for multi-arch images.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
