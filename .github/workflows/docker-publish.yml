# Workflow CI/CD per build, test e push dell'immagine Docker toolbox su GHCR.
# Pattern: test-before-push (build locale -> smoke test -> push multi-arch).
#
# Decisioni implementate: D-01..D-14 da 03-CONTEXT.md
# Pitfall mitigati: permessi espliciti, no load+platforms, QEMU prima di Buildx,
#                   cache GHA con scope per piattaforma (amd64 scritto dal test,
#                   arm64 scritto dal multi-arch) per evitare overwrite tra step.

name: Toolbox Docker Publish
run-name: Toolbox Docker Publish @ ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'internal/build/assets/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
  # NOTE: tag-driven semver publish lives in `docker-publish-tag.yml`. Two
  # workflow files because GitHub Actions ANDs `paths:` with every push
  # event (including tag pushes), so a single workflow can't both (a)
  # path-filter main pushes AND (b) fire on every `v*` tag.

# Group by ref so rapid main pushes (or workflow_dispatch landing on top
# of an in-flight push) collapse to one publisher per `:latest` /
# `:sha-<short>`. The previous group keyed on `github.run_id`, which is
# unique per run and made the stanza a no-op.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Dedicated BuildKit registry cache, separate from the image tags.
  CACHE_REF: ghcr.io/${{ github.repository }}:buildcache-main
  TEST_TAG: ghcr.io/${{ github.repository }}:test

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and load for testing
        uses: docker/build-push-action@v7
        with:
          context: internal/build/assets
          file: internal/build/assets/Dockerfile
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: |
            type=registry,ref=${{ env.CACHE_REF }}
            type=gha,scope=amd64
            type=gha,scope=arm64
          # mode=min: final-image layers only. Fetch-stage misses fall through
          # to the registry cache (CACHE_REF) — the authoritative mode=max store.
          cache-to: type=gha,mode=min,scope=amd64

      - name: Smoke test
        run: internal/build/assets/smoke-test.sh ${{ env.TEST_TAG }}

      - name: Build and push multi-arch
        id: push
        uses: docker/build-push-action@v7
        with:
          context: internal/build/assets
          file: internal/build/assets/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA build provenance + SPDX SBOM attached as OCI attestations
          # so consumers can verify supply-chain integrity from `cosign verify`
          # / `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=${{ env.CACHE_REF }}
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: |
            type=gha,mode=min,scope=arm64
            type=registry,ref=${{ env.CACHE_REF }},mode=max
