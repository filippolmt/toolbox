# Publishes the toolbox runtime image to GHCR on every main push that touches
# the image assets. The build/merge pipeline lives in the reusable workflow
# `docker-publish-reusable.yml`; this file is just the main-branch trigger + the
# main-specific cache ref and tag set.

name: Toolbox Docker Publish
run-name: Toolbox Docker Publish @ ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'internal/build/assets/**'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/docker-publish-reusable.yml'
  workflow_dispatch:
  # NOTE: tag-driven semver publish lives in `docker-release.yml`. Two
  # workflow files because GitHub Actions ANDs `paths:` with every push
  # event (including tag pushes), so a single workflow can't both (a)
  # path-filter main pushes AND (b) fire on every `v*` tag.

# Group by ref so rapid main pushes (or workflow_dispatch landing on top
# of an in-flight push) collapse to one publisher per `:latest` /
# `:sha-<short>`. The previous group keyed on `github.run_id`, which is
# unique per run and made the stanza a no-op.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/docker-publish-reusable.yml
    with:
      cache_ref: ghcr.io/${{ github.repository }}:buildcache-main
      tags: |
        type=raw,value=latest
        type=sha,prefix=sha-,format=short
