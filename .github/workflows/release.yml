name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Same tag can be pushed more than once in close succession; without
# cancellation the parallel runs race GoReleaser's asset upload and the
# loser 422s on `already_exists`. Cancel the older run so exactly one
# GoReleaser invocation reaches the GitHub Releases API per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GoReleaser authenticates via GITHUB_TOKEN and HOMEBREW_TAP_TOKEN
          # passed as env. Don't leave the checkout-injected credential in
          # `.git/config` where a subprocess could pick it up.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
