name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Tag pushes are unique by definition, so cancellation must not interrupt an
# in-flight release. Per-tag group with cancel-in-progress disabled keeps the
# knob present without preempting siblings.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GoReleaser authenticates via GITHUB_TOKEN and HOMEBREW_TAP_TOKEN
          # passed as env. Don't leave the checkout-injected credential in
          # `.git/config` where a subprocess could pick it up.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
