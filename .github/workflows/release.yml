name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Same tag can be pushed more than once in close succession (e.g. a manual
# push followed by a tooling re-push within seconds — observed on v0.36.0,
# which spawned two parallel Release runs that raced GoReleaser's asset
# upload and 422'd on `already_exists`). Cancel the in-flight run when a
# fresher push for the same tag arrives: the later push wins, and only one
# GoReleaser invocation talks to the GitHub Releases API per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GoReleaser authenticates via GITHUB_TOKEN and HOMEBREW_TAP_TOKEN
          # passed as env. Don't leave the checkout-injected credential in
          # `.git/config` where a subprocess could pick it up.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
