name: CI Retry Cancelled

# Safety net for a GitHub Actions race: the CI workflow's concurrency group
# (ci-${{ github.ref }}) is keyed on the PR ref, not the commit SHA. A stale
# manual "re-run failed jobs" on an old, superseded run attempt can race a
# fresh push's run and win the concurrency slot, cancelling the run for the
# CURRENT head commit. Since required status checks are evaluated per-SHA,
# the stale rerun's eventual success does not satisfy them — the PR is left
# BLOCKED with phantom-cancelled required checks and no replacement run ever
# starts on its own.
#
# This watches CI's completed runs: if one was cancelled while it was still
# the PR's current head commit (i.e. no newer push has since superseded it),
# it was almost certainly cancelled by that race rather than by a legitimate
# newer commit — so re-run its failed jobs once.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  pull-requests: read

jobs:
  retry-if-still-current:
    # run_attempt < 2 caps this to a single automatic retry per run, so a
    # repeatedly-raced commit doesn't retry forever.
    if: |
      github.event.workflow_run.conclusion == 'cancelled' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs if this run's commit is still the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "Run $RUN_ID has no associated pull request, skipping."
            exit 0
          fi

          CURRENT_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$CURRENT_SHA" != "$RUN_SHA" ]; then
            echo "PR #$PR_NUMBER has moved on to $CURRENT_SHA; the cancellation of $RUN_SHA is stale by design, not retrying."
            exit 0
          fi

          echo "Run $RUN_ID was cancelled while still matching PR #$PR_NUMBER's current head ($RUN_SHA) — re-running failed jobs."
          gh run rerun "$RUN_ID" --failed
