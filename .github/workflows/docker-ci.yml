name: Toolbox Docker PR
run-name: Toolbox Docker PR #${{ github.event.pull_request.number }}

# Deliberately unfiltered: `docker-ci` is a required status check, so the
# workflow must report even when no image build is needed. `detect` keeps those
# PRs cheap by skipping `docker-build`; the final job accepts that skip.
on:
  pull_request:
  # No push: branches: [main] trigger — docker-publish.yml runs the same
  # smoke-test pre-publish on main, so a re-run here would be redundant work
  # (~7min). Pre-merge validation happens on the pull_request event above.

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  # BuildKit registry cache published by the main-branch publish workflow
  # (docker-publish.yml, cache-to mode=max), and the only build cache this repo
  # uses: PR builds seed every stage from main instead of rebuilding it. The
  # bare `:buildcache` tag previously referenced here is written by nothing.
  CACHE_REF: ghcr.io/${{ github.repository }}:buildcache-main

# Cancel superseded builds on the same ref to free runner minutes during
# iterative PR pushes. Image builds are the most expensive job in the repo
# (~5–10 min apiece), so this is the highest-leverage concurrency knob.
concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    # Compute the matrix dynamically: the `amd64` variant always runs
    # (catches regressions in entrypoint.sh / smoke-test.sh / zshrc.sh —
    # the bulk of non-Dockerfile churn under
    # internal/build/assets/**); `arm64` runs only when the Dockerfile, this
    # workflow, or go.mod changes (the inputs whose arch-specific behavior that
    # variant validates — incl. the per-arch Go tarball pulled via GO_VERSION).
    # Saves ~5min on PRs that touch only the runtime scripts.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      docker: ${{ steps.filter.outputs.docker }}
      android_e2e: ${{ steps.filter.outputs.android_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect Dockerfile / workflow changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'internal/build/assets/**'
              - '.github/fixtures/android-e2e/**'
              - '.github/workflows/docker-ci.yml'
              - 'go.mod'
              - 'internal/container/**'
              - 'internal/mountplan/**'
              - 'internal/sessionplan/**'
              - 'internal/reload/**'
              - 'internal/imagereclaim/**'
            arch_coverage:
              - 'internal/build/assets/Dockerfile'
              - '.github/workflows/docker-ci.yml'
              - 'go.mod'
            android_e2e:
              - 'internal/build/assets/bin/android-sdk-install.sh'
              - 'internal/build/assets/bin/android-env.sh'
              - '.github/fixtures/android-e2e/**'
              - '.github/workflows/docker-ci.yml'
      - name: Build matrix
        id: set
        env:
          ARCH_COVERAGE: ${{ steps.filter.outputs.arch_coverage }}
        run: |
          legs='{"variant":"amd64","runner":"ubuntu-latest","tag":"toolbox:ci-amd64","platforms":"linux/amd64","e2e_gates":true}'
          if [ "$ARCH_COVERAGE" = "true" ]; then
            legs="$legs"',{"variant":"arm64","runner":"ubuntu-24.04-arm","tag":"toolbox:ci-arm64","platforms":"linux/arm64"}'
          fi
          echo "matrix={\"include\":[$legs]}" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    # Builds the runtime image and runs the smoke-test on every PR so that
    # Dockerfile ARG bumps (azure-cli, oci-cli, playwright, …) are validated
    # before merge — not after, inside docker-publish.yml. Cached via GHA.
    #
    # Matrix is computed by the `detect` job above:
    #   amd64   — always; smoke-test must report OK for the full tool set.
    #   arm64   — only on Dockerfile/workflow change. Builds for linux/arm64 on
    #             a native arm64 runner and smoke-tests it there. Catches
    #             arch-specific breakage BEFORE the multi-arch publish step:
    #             at build time a wrong SHA or a GLIBC mismatch, at run time a
    #             binary that builds but does not start, or the arm64-only
    #             branch of the final stage (the Foreign-Arch Runtime links).
    #             Every per-arch ARG case in the Dockerfile (zoxide, gws, bat,
    #             rtk, …) lives or dies here. Native arm64 (ubuntu-24.04-arm) is
    #             free for public repos and faster than QEMU on amd64.
    # `e2e_gates` marks the leg that also runs the Android end-to-end and the
    # real-daemon gates — amd64 only. On arm64 the x86_64 build-tools need
    # Rosetta (ADR 0017), which a Linux runner lacks, and the real-daemon gates
    # pin Claude Code and toolbox behaviour, not the image's arch.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: docker-build (${{ matrix.variant }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single source of truth for the Go version is go.mod's `toolchain`
      # directive (Renovate-bumped). The buildx context is the assets subdir,
      # so read go.mod from the repo root here and inject it as a build arg.
      - name: Resolve Go version from go.mod
        id: gover
        run: echo "version=$(awk '/^toolchain /{print substr($2,3)}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: internal/build/assets
          file: internal/build/assets/Dockerfile
          build-args: |
            GO_VERSION=${{ steps.gover.outputs.version }}
          load: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ matrix.tag }}
          # Cache scope per matrix variant so concurrent variants don't
          # overwrite each other's GHA cache layers.
          # Registry cache only, no `type=gha`. Exporting to the GitHub Actions
          # Cache hung indefinitely mid-export ("exporting to GitHub Actions
          # Cache", one layer, no further output) and burned the whole 30-minute
          # budget without ever reaching the smoke test — on this repo's own PRs
          # and on unrelated Renovate branches alike, both arches, so the trigger
          # was the service and not the change. Evidence in issue #765. The
          # registry cache is mode=max and already serves every stage, so the
          # loss is the final-image layer warm on PR builds.
          cache-from: type=registry,ref=${{ env.CACHE_REF }}

      - name: Smoke test
        env:
          IMAGE_TAG: ${{ matrix.tag }}
        run: internal/build/assets/smoke-test.sh "$IMAGE_TAG"

      # This is the proof that lets Renovate merge Android installer pin bumps:
      # use the real upstream downloads, then make Capacitor and Gradle consume
      # the result. HOME is an anonymous volume removed with the container; the
      # fixture is copied out of its read-only bind before Capacitor modifies it.
      - name: Android SDK end to end
        if: matrix.e2e_gates && needs.detect.outputs.android_e2e == 'true'
        env:
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          docker run --rm \
            --mount type=volume,destination=/home/toolbox \
            --mount type=bind,source="$PWD/.github/fixtures/android-e2e",destination=/fixture,readonly \
            "$IMAGE_TAG" bash -euc '
              android-sdk-install --accept-licenses
              . /usr/local/lib/toolbox/android-env.sh
              cp -R /fixture /tmp/android-e2e
              cd /tmp/android-e2e
              npm ci
              npx cap init "Toolbox Android E2E" dev.toolbox.android.e2e --web-dir www
              npx cap add android
              (cd android && ./gradlew assembleDebug)
              spool="$ANDROID_USER_HOME/cli/analytics/metrics/spool"
              if find "$spool" -type f -print -quit 2>/dev/null | grep -q .; then
                echo "android-sdk-install: analytics metrics spool is not empty" >&2
                exit 1
              fi
            '

      # Cross-container peer messaging rests on Claude Code implementation
      # detail (a pid-keyed session registry, a liveness check run in the
      # reading session's PID namespace), and the image upgrades Claude Code on
      # its own cadence — so this gate belongs on the image build, not on the
      # Go CI. It asserts the two conditions toolbox builds (shared socket dir,
      # resolvable peer pid) and deliberately does not parse /list-agents
      # output, which upstream may reformat at will.
      # See docs/adr/0003-cross-container-peer-messaging.md.
      #
      # It shares the job with the image build because the image is only
      # loaded on this runner; a separate job would have to
      # rebuild it or ship a multi-GB tarball between jobs. `!cancelled()`
      # keeps it independent of the smoke test all the same, so a smoke-test
      # failure reports both gates instead of hiding this one.
      - name: Set up Go
        if: ${{ !cancelled() && matrix.e2e_gates }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # IMAGE_TAG reaches the gate as the `image:` config override, so the
      # canonical ref lives only in internal/build.
      # No -run filter: the `dockergate` tag means "needs a real daemon and the
      # built image", so the tag itself selects the set — peer messaging, the
      # session reload and the image-reclamation refusal today, whatever else
      # earns it later. Packages are listed because the tag alone cannot find
      # them: a gate lives beside the code it pins.
      - name: Real-daemon gates (peer messaging, session reload, image reclamation)
        if: ${{ !cancelled() && matrix.e2e_gates }}
        env:
          IMAGE_TAG: ${{ matrix.tag }}
        run: go test -tags dockergate -count=1 ./internal/container/ ./internal/imagereclaim/

  docker-ci:
    # Stable required context. The matrix job does not exist on unrelated PRs,
    # but a required check must always report or GitHub leaves it pending.
    if: ${{ always() }}
    needs: [detect, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable Docker gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BUILD_RESULT: ${{ needs.docker-build.result }}
        run: |
          test "$DETECT_RESULT" = success
          case "$BUILD_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
