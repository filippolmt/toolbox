name: Docs

# Offline link + anchor validation for Markdown. Lives in its own workflow
# because ci.yml deliberately paths-ignores '**.md' and 'docs/**'.
# Offline mode checks relative links and #fragment anchors only — external
# URLs are never fetched, so third-party downtime can't block a PR.
# Mirror of the local `make check-links` target; keep the flag sets in sync.

on:
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --exclude-path docs/superpowers matches the make target; the dir is
      # gitignored so it never exists in CI checkouts — kept for parity.
      - name: Check Markdown links and anchors (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            --exclude-path docs/superpowers
            README.md CLAUDE.md CONTRIBUTING.md CONTEXT.md docs .claude/rules .claude/skills
          fail: true
