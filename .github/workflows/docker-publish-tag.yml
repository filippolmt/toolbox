name: Docker Publish (tag)

# Sibling of docker-publish.yml that runs on `v*` tag pushes only.
#
# Why a second file: GitHub Actions ANDs `paths:` with every push event,
# including tag pushes. Adding `tags: ['v*']` to docker-publish.yml would
# only fire the workflow when the tag *also* changes a path under
# internal/build/assets/** — almost never the case for release tags. The
# alternative (drop `paths:` from docker-publish.yml) regresses to
# republishing the image on every doc-only main push. Two workflow files
# is the cleanest split.
#
# Outputs (vs main-branch publish):
#   - Tags: vX.Y.Z + vX.Y + vX (semver), no `latest`, no `sha-<short>`.
#   - Same SBOM + provenance attestations.
#   - Pre-publish smoke-test still runs — gives confidence that the image
#     content at the tagged commit boots cleanly even if main has drifted
#     since the merge that produced this tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

# Tag pushes are unique by definition; per-tag group with cancellation
# disabled so a stuck job can be replaced manually but never preempted by
# a sibling.
concurrency:
  group: docker-publish-tag-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEST_TAG: ghcr.io/${{ github.repository }}:test

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and load for testing
        uses: docker/build-push-action@v7
        with:
          context: internal/build/assets
          file: internal/build/assets/Dockerfile
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Smoke test
        env:
          IMAGE_TAG: ${{ env.TEST_TAG }}
        run: internal/build/assets/smoke-test.sh "$IMAGE_TAG"

      - name: Build and push multi-arch
        id: push
        uses: docker/build-push-action@v7
        with:
          context: internal/build/assets
          file: internal/build/assets/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
