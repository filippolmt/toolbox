name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for blame/relevancy

      - name: Mask SONAR_HOST_URL in logs
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: echo "::add-mask::$SONAR_HOST_URL"

      - name: Diagnose Sonar reachability
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set +e
          echo "Runner egress IP:"
          curl -sS https://api.ipify.org && echo
          echo "Validate token against Sonar:"
          code=$(curl -sS -o /tmp/resp -w "%{http_code}" -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/authentication/validate")
          echo "HTTP $code"
          head -c 500 /tmp/resp || true
          echo

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
