name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel superseded runs on the same ref so iterative pushes to a PR don't
# queue redundant lint/test cycles.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -count=1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Single source of truth for the golangci-lint version is GOLANGCI_VERSION
      # in the Makefile (Renovate-bumped); read it here so CI and `make go-lint`
      # never drift.
      - name: Resolve golangci-lint version from Makefile
        id: gola
        run: echo "version=$(awk -F'[[:space:]:=]+' '/^GOLANGCI_VERSION/{print $2}' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.gola.outputs.version }}

  renovate-validate:
    # Validates renovate.json with the official validator so that future edits
    # to customManagers (GOPLS_VERSION, GOIMPORTS_VERSION, GOLANGCI_VERSION, …) do
    # not silently produce an invalid config.
    #
    # Node 24 is required: renovate@43.x (current latest) declares
    # `engines.node: ^24.11.0`. Without setup-node, ubuntu-latest ships Node
    # 20 and npx silently falls back to renovate@39.x — which predates the
    # `managerFilePatterns` field and rejects the whole config.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate renovate.json
        run: npx --yes --package renovate renovate-config-validator renovate.json
