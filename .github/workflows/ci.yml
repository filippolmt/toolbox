name: CI

# The PR trigger is deliberately unfiltered. `test`, `lint` and
# `renovate-validate` are required status checks on `main`: a workflow that
# never starts leaves them *pending*, not skipped, so any markdown-only PR was
# unmergeable (#700 hit this). Running the three jobs on a docs PR costs a few
# runner-minutes and always reports. The push trigger keeps the filter — no
# ruleset consumes those runs, so a docs merge to `main` still skips them.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel superseded runs on the same ref so iterative pushes to a PR don't
# queue redundant lint/test cycles.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic

      # The repo-side half of the coverage gate. SonarQube owns the sharp one
      # (80% on *new code*), but `analyze` is skipped whenever the server is
      # powered down and GitHub counts a skipped required check as satisfied —
      # so on its own it leaves a PR pushed outside working hours with no
      # coverage gate at all. This job always runs, so the floor always holds.
      #
      # The number is lower because the denominator is different: this is the
      # whole tree's total, Sonar's is the lines the PR touched. It also sits a
      # couple of points under the current total on purpose — a floor set to
      # today's exact figure turns the first sizeable untested addition into a
      # red required check on an unrelated PR, and the error names the global
      # total rather than that PR's own code. Raise it as the total climbs;
      # never lower it to make a red build green.
      # See docs/internals/sonarqube.md#the-two-coverage-numbers.
      - name: Enforce the coverage floor
        env:
          COVERAGE_MIN: '74'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "total coverage: ${total}% (floor ${COVERAGE_MIN}%)"
          if awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN{exit !(t+0 < m+0)}'; then
            echo "::error::total coverage ${total}% is below the ${COVERAGE_MIN}% floor"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Single source of truth for the golangci-lint version is GOLANGCI_VERSION
      # in the Makefile (Renovate-bumped); read it here so CI and `make go-lint`
      # never drift.
      - name: Resolve golangci-lint version from Makefile
        id: gola
        run: echo "version=$(awk -F'[[:space:]:=]+' '/^GOLANGCI_VERSION/{print $2}' Makefile)" >> "$GITHUB_OUTPUT"

      # golangci-lint's analysis cache (staticcheck facts, ~/.cache/golangci-lint)
      # is what poisons: a stale SA5011 nil-deref false positive on t.Fatal-guarded
      # tests that a cold run — and every local `make go-lint` — passes. The
      # action's built-in cache is shared across branches (main's entry is
      # restorable by every PR) and long-lived, so one poisoning infected every
      # branch until a manual `gh cache delete`. Instead: disable the action's own
      # cache (skip-cache) and manage the dir ourselves with a key scoped per
      # branch AND per day, with NO restore-keys — a branch never falls back to
      # another branch's or a previous day's cache, so a poisoning is contained to
      # one branch for at most a day and then self-heals.
      - name: Daily cache bucket
        id: bucket
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: golangci-lint cache (per-branch, daily)
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          # head_ref on PRs (the source branch), ref_name on push — both give the
          # branch name, never a shared '<pr>/merge' ref. No restore-keys on purpose.
          key: golangci-${{ runner.os }}-${{ steps.gola.outputs.version }}-${{ github.head_ref || github.ref_name }}-${{ steps.bucket.outputs.day }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.gola.outputs.version }}
          skip-cache: true

  renovate-validate:
    # Validates renovate.json with the official validator so that future edits
    # to customManagers (GOPLS_VERSION, GOIMPORTS_VERSION, GOLANGCI_VERSION, …) do
    # not silently produce an invalid config.
    #
    # Node 24 is required: renovate@43.x (current latest) declares
    # `engines.node: ^24.11.0`. Without setup-node, ubuntu-latest ships Node
    # 20 and npx silently falls back to renovate@39.x — which predates the
    # `managerFilePatterns` field and rejects the whole config.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate renovate.json
        env:
          # Pinned, not `latest`. This job is a required check on main, so an
          # unresolvable `latest` from a third party blocks every merge in the
          # repo — which is what 44.34.0 did: published in the registry metadata
          # but its tarball 404s, so `npx --yes --package renovate` fails before
          # it ever reads renovate.json. Renovate bumps this pin itself, via the
          # customManager for this file in renovate.json.
          RENOVATE_VERSION: 44.49.0
        run: |
          npx --yes --package "renovate@${RENOVATE_VERSION}" \
            renovate-config-validator renovate.json
